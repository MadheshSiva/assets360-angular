<div class="map-container">
  <div #mapEl class="map-canvas"></div>
  <div class="map-controls">
    <button type="button" class="map-control-btn" (click)="zoomIn()" aria-label="Zoom in">+</button>
    <button type="button" class="map-control-btn" (click)="zoomOut()" aria-label="Zoom out">&minus;</button>

    <button
      *ngIf="!controlsDisabled"
      type="button"
      class="map-control-btn"
      [class.is-active]="isDrawing"
      title="Draw zone (click to place points, double-click to finish)"
      (click)="toggleDraw()"
    >
      <svg class="map-control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
      </svg>
    </button>

    <button
      *ngIf="!controlsDisabled"
      type="button"
      class="map-control-btn"
      [class.is-active]="isPlacingSensor"
      title="Add asset (click inside the selected zone; click an asset to remove it)"
      [disabled]="!selectedZoneId"
      (click)="toggleAddSensor()"
    >
      <svg class="map-control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
        <path d="M3.27 6.96 12 12.01l8.73-5.05"></path>
        <path d="M12 22.08V12"></path>
      </svg>
    </button>

    <div class="map-control-btn-wrap" *ngIf="!controlsDisabled">
      <button type="button" class="map-control-btn" title="Zone type" (click)="toggleZoneTypePicker()">
        <svg class="map-control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"></path>
          <path d="M4 12h16"></path>
        </svg>
      </button>
      <div class="map-popover map-zonetype-popover" *ngIf="showZoneTypePicker">
        <button
          *ngFor="let t of zoneTypeOptions"
          type="button"
          class="map-zonetype-option"
          [class.is-active]="(selectedZone?.zoneType ?? drawZoneType) === t.value"
          (click)="setZoneType(t.value)"
        >
          <span class="map-zonetype-swatch" [style.background]="t.color"></span>
          {{ t.label }}
        </button>
      </div>
    </div>

    <div class="map-control-btn-wrap" *ngIf="!controlsDisabled">
      <button type="button" class="map-control-btn" title="Zone color" (click)="toggleColorPicker()">
        <span class="map-color-swatch" [style.background]="selectedZone?.color ?? drawColor"></span>
      </button>
      <div class="map-popover map-color-popover" *ngIf="showColorPicker">
        <button
          *ngFor="let c of zoneColors"
          type="button"
          class="map-color-option"
          [style.background]="c.value"
          [title]="c.label"
          (click)="setColor(c.value)"
        ></button>
      </div>
    </div>

    <button
      *ngIf="!controlsDisabled"
      type="button"
      class="map-control-btn"
      title="Delete selected zone"
      [disabled]="!selectedZoneId"
      (click)="deleteSelectedZone()"
    >
      <svg class="map-control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"></path>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
      </svg>
    </button>

    <div class="map-control-btn-wrap" *ngIf="!controlsDisabled">
      <button type="button" class="map-control-btn" title="Zone opacity" (click)="toggleOpacitySlider()">
        <svg class="map-control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
        </svg>
      </button>
      <div class="map-popover map-opacity-popover" *ngIf="showOpacitySlider">
        <input
          type="range"
          class="map-opacity-slider"
          min="0.1"
          max="1"
          step="0.05"
          [value]="selectedZone?.opacity ?? drawOpacity"
          (input)="setOpacity($any($event.target).valueAsNumber)"
        />
      </div>
    </div>
  </div>

  <p class="map-draw-hint" *ngIf="isDrawing">
    Click to place each corner. Click the starting point again (or press Enter) to finish.
  </p>
  <p class="map-draw-hint" *ngIf="isPlacingSensor">
    Click inside the zone to add an asset. Click an asset to remove it.
  </p>
</div>
