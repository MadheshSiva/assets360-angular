<div class="modal-overlay" *ngIf="visible" (click)="onOverlayClick($event)">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <h3 class="modal-title">{{ isEditMode ? 'Edit User' : 'Add User' }}</h3>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form #addUserForm="ngForm" novalidate>
        <div class="form-grid">

          <div class="form-field">
            <label for="userName">USER NAME</label>
            <input
              id="userName"
              type="text"
              name="userName"
              placeholder="e.g. John Doe"
              [(ngModel)]="model.userName"
              required
            />
          </div>

          <div class="form-field">
            <label for="shortName">SHORT NAME</label>
            <input
              id="shortName"
              type="text"
              name="shortName"
              placeholder="e.g. JohnD"
              [(ngModel)]="model.shortName"
            />
          </div>

          <div class="form-field">
            <label for="contactNo">CONTACT NO</label>
            <input
              id="contactNo"
              type="text"
              name="contactNo"
              placeholder="+971 50 123 4567"
              [(ngModel)]="model.contactNo"
            />
          </div>

          <div class="form-field">
            <label for="emailId">EMAIL ID</label>
            <input
              id="emailId"
              type="email"
              name="emailId"
              placeholder="john@hospital.com"
              [(ngModel)]="model.email"
              required
            />
          </div>

          <div class="form-field">
            <label for="loginPassword">{{ isEditMode ? 'NEW PASSWORD' : 'PASSWORD' }}</label>
            <input
              id="loginPassword"
              type="password"
              name="loginPassword"
              placeholder="Enter password"
              [(ngModel)]="model.loginPassword"
              required
            />
            <span class="field-hint" *ngIf="isEditMode">Required by the system to save any changes.</span>
          </div>

          <div class="form-field">
            <label for="userRoleId">ROLE NAME</label>
            <div class="select-wrap">
              <select
                id="userRoleId"
                name="userRoleId"
                [(ngModel)]="model.userRoleId"
              >
                <option *ngFor="let role of roleOptions" [value]="role.roleId">{{ role.roleName }}</option>
              </select>
              <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <div class="form-field">
            <label for="adUserName">ACTIVE DIRECTORY USER NAME</label>
            <input
              id="adUserName"
              type="text"
              name="adUserName"
              placeholder="e.g. john_ad"
              [(ngModel)]="model.activeDirectoryUserName"
            />
          </div>

        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="onCancel()">Cancel</button>
      <button class="btn btn-primary" type="button" (click)="onSave()">{{ isEditMode ? 'Update User' : 'Save User' }}</button>
    </div>

  </div>
</div>
