<section class="projects-page">
  <h1 class="page-title">Project</h1>

  <div class="projects-layout">
    <aside class="filter-panel">
      <button type="button" class="add-project-btn" (click)="openAddProject()">
        Add Project
      </button>

      <ul class="cascade-list">
        <li
          *ngFor="let row of visibleRows; trackBy: trackByRow"
          class="cascade-row is-clickable"
          [class.is-header]="row.depth === 0"
          [class.is-active]="isActive(row.node.id)"
          [attr.data-depth]="row.depth"
          (click)="toggle(row.node)"
        >
          <ng-container *ngIf="editingId === row.node.id; else displayLabel">
            <input
              type="text"
              class="row-edit-input"
              [(ngModel)]="editingValue"
              (click)="$event.stopPropagation()"
              (keydown.enter)="commitEdit()"
              (keydown.escape)="cancelEdit()"
              (blur)="commitEdit()"
              autofocus
            />
          </ng-container>
          <ng-template #displayLabel>
            <span class="row-label">{{ row.node.name }}</span>
            <span class="area-type-badge" *ngIf="areaTypeOf(row.node) as areaType" [title]="areaTypeLabels[areaType]">
              {{ areaTypeShortLabels[areaType] }}
            </span>
          </ng-template>

          <span class="row-actions">
            <button
              *ngIf="row.node.kind === 'project'"
              type="button"
              class="row-action-btn"
              title="Add Area"
              (click)="openAddArea(row.node, $event)"
            >
              <img src="addd.png" alt="Add Area" />
            </button>

            <ng-container *ngIf="row.node.kind === 'area'">
              <button
                *ngIf="canAddZone(row.node)"
                type="button"
                class="row-action-btn"
                title="Add Zone"
                (click)="openAddZone(row.node, $event)"
              >
                <img src="addd.png" alt="Add Zone" />
              </button>
              <button
                *ngIf="canAddBuilding(row.node)"
                type="button"
                class="row-action-btn"
                title="Add Building"
                (click)="openAddBuilding(row.node, $event)"
              >
                <img src="addd.png" alt="Add Building" />
              </button>
            </ng-container>

            <button
              *ngIf="row.node.kind === 'building'"
              type="button"
              class="row-action-btn"
              title="Add Floor"
              (click)="openAddFloor(row.node, $event)"
            >
              <img src="addd.png" alt="Add Floor" />
            </button>

            <button
              *ngIf="row.node.kind === 'floor'"
              type="button"
              class="row-action-btn"
              title="Add Zone"
              (click)="openAddZone(row.node, $event)"
            >
              <img src="addd.png" alt="Add Zone" />
            </button>

            <button
              type="button"
              class="row-action-btn"
              title="Rename"
              (click)="startEdit(row.node, $event)"
            >
              <img src="edit.png" alt="Edit" />
            </button>
            <button
              type="button"
              class="row-action-btn"
              title="Delete"
              (click)="deleteNode(row.node, $event)"
            >
              <img src="del.png" alt="Delete" />
            </button>
            <span class="row-chevron" aria-hidden="true" *ngIf="isExpandable(row.node) || expanded.has(row.node.id)">
              <ng-container *ngIf="expanded.has(row.node.id); else chevDown">&rsaquo;</ng-container>
              <ng-template #chevDown>v</ng-template>
            </span>
          </span>
        </li>
      </ul>
    </aside>

    <div class="map-panel">
      <app-map [pins]="mapPins()"></app-map>
    </div>
  </div>

  <!-- Add Project -->
  <div class="modal-overlay" *ngIf="isAddProjectOpen" (click)="closeAddProject()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <h2 class="modal-title">Add Project</h2>
        <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeAddProject()">
          &times;
        </button>
      </header>

      <div class="modal-body">
        <label class="field-label" for="project-name">
          Project Name <span class="required-mark">*</span>
        </label>
        <input
          id="project-name"
          type="text"
          class="field-input"
          placeholder="e.g. Muscat Campus"
          [(ngModel)]="addProjectForm.name"
        />

        <label class="field-label" for="project-description">Description</label>
        <textarea
          id="project-description"
          class="field-textarea"
          placeholder="Brief overview of the project..."
          rows="4"
          [(ngModel)]="addProjectForm.description"
        ></textarea>

        <div class="field-row">
          <div class="field-col">
            <label class="field-label" for="week-start">
              Week Start <span class="required-mark">*</span>
            </label>
            <input
              id="week-start"
              type="date"
              class="field-input"
              [(ngModel)]="addProjectForm.weekStart"
            />
          </div>
          <div class="field-col">
            <label class="field-label" for="week-end">
              Week End <span class="required-mark">*</span>
            </label>
            <input
              id="week-end"
              type="date"
              class="field-input"
              [(ngModel)]="addProjectForm.weekEnd"
            />
          </div>
        </div>

        <label class="field-label">Status</label>
        <button
          type="button"
          class="status-toggle"
          [class.is-active]="addProjectForm.status === 'active'"
          (click)="toggleAddProjectStatus()"
        >
          <span class="status-toggle-knob"></span>
          <span class="status-toggle-label">{{ addProjectForm.status === 'active' ? 'Active' : 'Inactive' }}</span>
        </button>

        <p class="modal-error" *ngIf="addProjectError">{{ addProjectError }}</p>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeAddProject()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submitAddProject()">Create Project</button>
      </footer>
    </div>
  </div>

  <!-- Add Area / Building / Floor / Zone (shared) -->
  <div class="modal-overlay" *ngIf="childModal" (click)="closeChildModal()">
    <div class="modal-card modal-card-sm" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <h2 class="modal-title">{{ childModalTitle }}</h2>
        <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeChildModal()">
          &times;
        </button>
      </header>

      <div class="modal-body">
        <label class="field-label" for="child-name">
          Name <span class="required-mark">*</span>
        </label>
        <input
          id="child-name"
          type="text"
          class="field-input"
          [(ngModel)]="childFormName"
          (keydown.enter)="submitChildModal()"
          autofocus
        />

        <ng-container *ngIf="childModal?.kind === 'area'">
          <label class="field-label" for="child-area-type">Area Type</label>
          <select id="child-area-type" class="field-input" [(ngModel)]="childFormAreaType">
            <option value="indoor">Indoor</option>
            <option value="outdoor">Outdoor</option>
            <option value="indoor_outdoor">Indoor + Outdoor</option>
          </select>
          <p class="field-hint" *ngIf="childFormAreaType === 'indoor'">
            Zones for this area are added within its buildings' floors.
          </p>
          <p class="field-hint" *ngIf="childFormAreaType !== 'indoor'">
            Zones can be added directly on this area.
          </p>
        </ng-container>

        <ng-container *ngIf="childModal?.kind === 'zone'">
          <label class="field-label" for="child-zone-color">Color</label>
          <select id="child-zone-color" class="field-input" [(ngModel)]="childFormZoneColor">
            <option *ngFor="let c of zoneColors" [value]="c.value">{{ c.label }}</option>
          </select>
        </ng-container>

        <p class="modal-error" *ngIf="childFormError">{{ childFormError }}</p>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeChildModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submitChildModal()">Create</button>
      </footer>
    </div>
  </div>
</section>
