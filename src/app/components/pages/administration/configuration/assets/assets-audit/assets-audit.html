<div class="lh-container">

  <!-- Header Row -->
  <div class="lh-header">
    <h1 class="lh-title">Assets Audit</h1>

    <div class="icon-toolbar">
      <button class="icon-btn" title="Add" (click)="onAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="icon-btn" title="Upload" (click)="onUpload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19V6"></path>
          <path d="M6 12l6-6 6 6"></path>
          <path d="M5 21h14"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Download" (click)="onDownload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v13"></path>
          <path d="M6 12l6 6 6-6"></path>
          <path d="M5 21h14"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Refresh" (click)="onRefresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <path d="M21 4v5h-5"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Delete" (click)="onDelete()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Sub-navigation within Assets Audit — "Configuration" today, room for
       Audit Execution / Audit Findings etc. as sibling tabs later. -->
  <div class="audit-tabs">
    <button
      *ngFor="let tab of tabs"
      type="button"
      class="audit-tab"
      [class.active]="activeTab === tab.key"
      (click)="activeTab = tab.key"
    >{{ tab.label }}</button>
  </div>

  <ng-container *ngIf="activeTab === 'configuration'">
    <!-- Table -->
    <div class="table-wrapper">
      <table class="lh-table">
        <thead>
          <tr>
            <th>Asset ID</th>
            <th>Asset Name</th>
            <th>Audit Code</th>
            <th>Audit Name</th>
            <th>Audit Start Date</th>
            <th>Audit End Date</th>
            <th>Active</th>
            <th>Created Date</th>
            <th>Created By</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let entry of entries">
            <td>
              <input type="text" class="cell-input" placeholder="e.g. AST-0001" [(ngModel)]="entry.assetId" />
            </td>
            <td>
              <input type="text" class="cell-input" placeholder="e.g. Forklift Unit 4" [(ngModel)]="entry.assetName" />
            </td>
            <td>
              <input type="text" class="cell-input" placeholder="e.g. 210526" [(ngModel)]="entry.auditCode" />
            </td>
            <td>
              <input type="text" class="cell-input" placeholder="e.g. Galfar 05JAN26" [(ngModel)]="entry.auditName" />
            </td>
            <td>
              <input type="date" class="cell-input" [(ngModel)]="entry.auditStartDate" />
            </td>
            <td>
              <input type="date" class="cell-input" [(ngModel)]="entry.auditEndDate" />
            </td>
            <td class="active-cell">
              <input type="checkbox" class="active-checkbox" [(ngModel)]="entry.active" />
            </td>
            <td class="system-cell">{{ entry.createdDate || '-' }}</td>
            <td class="system-cell">{{ entry.createdBy || '-' }}</td>
            <td class="actions-col">
              <app-row-actions (edit)="editRow(entry)" (delete)="deleteRow(entry)"></app-row-actions>
            </td>
          </tr>

          <tr *ngIf="entries.length === 0">
            <td colspan="10" class="empty-row">No audit records found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

</div>

<app-import-file-modal
  *ngIf="showImportModal"
  [columns]="importColumns"
  fileBaseName="assets-audit"
  (cancelled)="showImportModal = false"
  (imported)="onImportRows($event)"
></app-import-file-modal>
